<svg xmlns="http://www.w3.org/2000/svg" width="760" height="208" aria-labelledby="data-flow-title" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" viewBox="0 0 760 208"><title id="data-flow-title">Data flow of a typical run: scan (scan.mjs) adds URLs to data/pipeline.md; evaluate (oferta.md with cv.md) writes reports/NNN-*.md and a row in the tracker, data/applications.md, which links the report; then you apply: you review and click Submit yourself.</title><rect width="760" height="208" fill="#fff" rx="12"/><rect width="158" height="64" x="13" y="16" fill="#f6f8fa" stroke="#d0d7de" rx="10"/><clipPath id="df-0"><rect width="158" height="64" x="13" y="16" rx="10"/></clipPath><rect width="6" height="64" x="13" y="16" fill="#DD7627" clip-path="url(#df-0)"/><text x="92" y="43" fill="#1f2328" font-size="16" font-weight="700" text-anchor="middle">Scan</text><text x="92" y="64" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">scan.mjs</text><rect width="158" height="64" x="205" y="16" fill="#f6f8fa" stroke="#d0d7de" rx="10"/><clipPath id="df-1"><rect width="158" height="64" x="205" y="16" rx="10"/></clipPath><rect width="6" height="64" x="205" y="16" fill="#DD7627" clip-path="url(#df-1)"/><text x="284" y="43" fill="#1f2328" font-size="16" font-weight="700" text-anchor="middle">URL inbox</text><text x="284" y="64" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">data/pipeline.md</text><rect width="158" height="64" x="397" y="16" fill="#f6f8fa" stroke="#d0d7de" rx="10"/><clipPath id="df-2"><rect width="158" height="64" x="397" y="16" rx="10"/></clipPath><rect width="6" height="64" x="397" y="16" fill="#DD7627" clip-path="url(#df-2)"/><text x="476" y="43" fill="#1f2328" font-size="16" font-weight="700" text-anchor="middle">Evaluate</text><text x="476" y="64" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">oferta.md + cv.md</text><rect width="158" height="64" x="589" y="16" fill="#fdf1e7" stroke="#DD7627" rx="10"/><text x="668" y="43" fill="#1f2328" font-size="16" font-weight="700" text-anchor="middle">Report</text><text x="668" y="64" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">reports/NNN-*.md</text><line x1="171" x2="198" y1="48" y2="48" stroke="#8c959f" stroke-width="2"/><path fill="#8c959f" d="M196 42 L196 54 L205 48 Z"/><line x1="363" x2="390" y1="48" y2="48" stroke="#8c959f" stroke-width="2"/><path fill="#8c959f" d="M388 42 L388 54 L397 48 Z"/><line x1="555" x2="582" y1="48" y2="48" stroke="#8c959f" stroke-width="2"/><path fill="#8c959f" d="M580 42 L580 54 L589 48 Z"/><line x1="476" x2="476" y1="80" y2="121" stroke="#8c959f" stroke-width="2"/><path fill="#8c959f" d="M470 119 L482 119 L476 128 Z"/><line x1="668" x2="668" y1="80" y2="121" stroke="#8c959f" stroke-width="2"/><path fill="#8c959f" d="M662 119 L674 119 L668 128 Z"/><text x="676" y="108" fill="#59636e" font-size="12">linked</text><rect width="260" height="64" x="442" y="128" fill="#fdf1e7" stroke="#DD7627" rx="10"/><text x="572" y="155" fill="#1f2328" font-size="16" font-weight="700" text-anchor="middle">Tracker</text><text x="572" y="176" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">data/applications.md</text><line x1="442" x2="417" y1="160" y2="160" stroke="#8c959f" stroke-width="2"/><path fill="#8c959f" d="M419 154 L419 166 L410 160 Z"/><rect width="320" height="64" x="90" y="128" fill="#fff" stroke="#DD7627" stroke-width="2" rx="32"/><text x="250" y="155" fill="#1f2328" font-size="16" font-weight="700" text-anchor="middle">Apply</text><text x="250" y="176" fill="#59636e" font-size="13" text-anchor="middle">you review, then click Submit yourself</text></svg>