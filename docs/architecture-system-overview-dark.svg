<svg xmlns="http://www.w3.org/2000/svg" width="760" height="568" aria-labelledby="system-overview-title" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" viewBox="0 0 760 568"><title id="system-overview-title">System overview: an AI coding CLI agent reads AGENTS.md and modes/*.md and runs one of three flows. Single evaluation (modes/auto-pipeline.md) goes straight to output. Portal scan (scan.mjs and modes/scan.md) fills the URL inbox, data/pipeline.md, which pipeline mode then evaluates. Batch processing (batch/batch-runner.sh) runs N headless workers, one per offer: claude -p workers run in parallel, other CLIs one offer at a time. All three feed the output pipeline: a report (reports/NNN-*.md, the A-H evaluation), a PDF (generate-pdf.mjs, HTML through Playwright) and a tracker TSV (batch/tracker-additions/, merged by merge-tracker.mjs) into the canonical tracker, data/applications.md.</title><rect width="760" height="568" fill="#0d1117" rx="12"/><rect width="360" height="64" x="200" y="16" fill="#161b22" stroke="#30363d" rx="10"/><clipPath id="so-agent"><rect width="360" height="64" x="200" y="16" rx="10"/></clipPath><rect width="6" height="64" x="200" y="16" fill="#DD7627" clip-path="url(#so-agent)"/><text x="380" y="43" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">AI coding CLI agent</text><text x="380" y="64" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">reads AGENTS.md + modes/*.md</text><line x1="380" x2="380" y1="80" y2="100" stroke="#6e7681" stroke-width="2"/><line x1="140" x2="620" y1="100" y2="100" stroke="#6e7681" stroke-linecap="round" stroke-width="2"/><line x1="140" x2="140" y1="100" y2="117" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M134 115 L146 115 L140 124 Z"/><line x1="380" x2="380" y1="100" y2="117" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M374 115 L386 115 L380 124 Z"/><line x1="620" x2="620" y1="100" y2="117" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M614 115 L626 115 L620 124 Z"/><rect width="210" height="64" x="35" y="124" fill="#161b22" stroke="#30363d" rx="10"/><clipPath id="so-single"><rect width="210" height="64" x="35" y="124" rx="10"/></clipPath><rect width="6" height="64" x="35" y="124" fill="#DD7627" clip-path="url(#so-single)"/><text x="140" y="151" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">Single evaluation</text><text x="140" y="172" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">modes/auto-pipeline.md</text><rect width="210" height="64" x="275" y="124" fill="#161b22" stroke="#30363d" rx="10"/><clipPath id="so-scan"><rect width="210" height="64" x="275" y="124" rx="10"/></clipPath><rect width="6" height="64" x="275" y="124" fill="#DD7627" clip-path="url(#so-scan)"/><text x="380" y="151" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">Portal scan</text><text x="380" y="172" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">scan.mjs + modes/scan.md</text><rect width="210" height="64" x="515" y="124" fill="#161b22" stroke="#30363d" rx="10"/><clipPath id="so-batch"><rect width="210" height="64" x="515" y="124" rx="10"/></clipPath><rect width="6" height="64" x="515" y="124" fill="#DD7627" clip-path="url(#so-batch)"/><text x="620" y="151" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">Batch processing</text><text x="620" y="172" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">batch/batch-runner.sh</text><line x1="380" x2="380" y1="188" y2="213" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M374 211 L386 211 L380 220 Z"/><line x1="620" x2="620" y1="188" y2="213" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M614 211 L626 211 L620 220 Z"/><rect width="210" height="64" x="275" y="220" fill="#161b22" stroke="#30363d" rx="10"/><clipPath id="so-inbox"><rect width="210" height="64" x="275" y="220" rx="10"/></clipPath><rect width="6" height="64" x="275" y="220" fill="#DD7627" clip-path="url(#so-inbox)"/><text x="380" y="247" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">URL inbox</text><text x="380" y="268" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">data/pipeline.md</text><rect width="210" height="64" x="515" y="220" fill="#161b22" stroke="#30363d" rx="10"/><clipPath id="so-workers"><rect width="210" height="64" x="515" y="220" rx="10"/></clipPath><rect width="6" height="64" x="515" y="220" fill="#DD7627" clip-path="url(#so-workers)"/><text x="620" y="247" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">N headless workers</text><text x="620" y="268" fill="#9198a1" font-size="13" text-anchor="middle">parallel only with claude -p</text><line x1="140" x2="140" y1="188" y2="309" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M134 307 L146 307 L140 316 Z"/><line x1="380" x2="380" y1="284" y2="309" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M374 307 L386 307 L380 316 Z"/><line x1="620" x2="620" y1="284" y2="309" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M614 307 L626 307 L620 316 Z"/><text x="388" y="304" fill="#9198a1" font-size="12">pipeline mode</text><rect width="700" height="136" x="30" y="316" fill="#0d1117" stroke="#30363d" rx="10"/><text x="380" y="344" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">Output pipeline</text><rect width="200" height="76" x="40" y="360" fill="#2a1d12" stroke="#DD7627" rx="10"/><text x="140" y="384" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">Report</text><text x="140" y="404" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">reports/NNN-*.md</text><text x="140" y="423" fill="#9198a1" font-size="12.5" text-anchor="middle">A-H evaluation</text><rect width="200" height="76" x="280" y="360" fill="#2a1d12" stroke="#DD7627" rx="10"/><text x="380" y="384" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">PDF</text><text x="380" y="404" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">generate-pdf.mjs</text><text x="380" y="423" fill="#9198a1" font-size="12.5" text-anchor="middle">HTML → Playwright</text><rect width="200" height="76" x="520" y="360" fill="#2a1d12" stroke="#DD7627" rx="10"/><text x="620" y="384" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">Tracker TSV</text><text x="620" y="404" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">batch/tracker-additions/</text><text x="620" y="423" fill="#9198a1" font-size="12.5" text-anchor="middle">merged by merge-tracker.mjs</text><line x1="380" x2="380" y1="452" y2="481" stroke="#6e7681" stroke-width="2"/><path fill="#6e7681" d="M374 479 L386 479 L380 488 Z"/><rect width="300" height="64" x="230" y="488" fill="#2a1d12" stroke="#DD7627" rx="10"/><text x="380" y="515" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">Canonical tracker</text><text x="380" y="536" fill="#9198a1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle">data/applications.md</text></svg>